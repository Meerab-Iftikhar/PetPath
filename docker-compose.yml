version: "3.9"

services:
  backend:
    build: ./backend
    container_name: petpath-backend-dev
    ports:
      - "5001:5001"
    env_file:
      - ./backend/config/.env
    restart: always
    volumes:
      - ./backend:/app
    networks:
      - petpath-network


  frontend:
    build: ./frontend
    container_name: petpath-frontend-dev
    ports:
      - "3001:5173"
    depends_on:
      - backend
    restart: always
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - petpath-network

networks:
  petpath-network:
    driver: bridge
